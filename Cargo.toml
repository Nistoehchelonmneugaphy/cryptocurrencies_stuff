[package]
name = "cryptocurrencies_stuff"
version = "0.1.0"
edition = "2024"

[dependencies]
bip39 = { version = "2.2.2", features = ["rand"] }
bip32 = "0.5.3"
secp256k1 = { version = "0.31.1", features = ["rand"] }
sha2 = "0.11"
ripemd = "0.2"
bech32 = "0.11.1"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13.3", features = ["json"] }
